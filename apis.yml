name: SwingVision
description: SwingVision is an AI-powered tennis and pickleball platform built by a team
  of A.I. experts from Tesla and Apple, venture-backed by Tennis Australia, Sony, and
  Techstars. Its mobile app processes video on-device with computer vision to deliver
  automated line calling, scoring, match stats, and highlight reels from a single
  phone or tablet camera. SwingVision is a consumer application and does not publish
  a public developer API; its api.swing.vision backend is private and undocumented,
  with data export offered through the app as video and spreadsheet files.
